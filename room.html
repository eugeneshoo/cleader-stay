<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숙소 · CLEADER STAY</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="room">
<header id="hd"></header>
<main id="main" class="wrap">
  <div class="crumb" id="crumb"><a href="./">CLEADER STAY</a></div>
  <div class="rhead">
    <div><div class="eyebrow" id="r-area"></div><h1 id="r-name">불러오는 중…</h1><div class="meta" id="r-meta"></div></div>
  </div>
  <div class="gal" id="gal"></div>
  <div class="detail">
    <div>
      <div class="tags" id="r-tags"></div>
      <p class="rline" id="r-line"></p>
      <div class="desc" id="r-desc"></div>
      <div class="care">
        <div><b>사진으로 확인하는 청소</b><p>입실 전·퇴실 후 매니저가 숙소 상태를 사진으로 남깁니다.</p></div>
        <div><b>침구·비품 관리</b><p>세탁한 침구와 기본 비품을 매번 확인해 채웁니다.</p></div>
        <div><b>대표번호 응대</b><p>머무는 동안 불편한 점은 1668-2817로 알려 주세요.</p></div>
      </div>
    </div>
    <aside class="bookbox" id="book">
      <div class="pr" id="r-price">요금 문의</div>
      <div class="note" style="margin-top:0">빈 날짜를 확인하고 예약을 요청하세요</div>
      <div class="cal-head" id="calHead"><button type="button" class="prev" aria-label="이전 달">‹</button><b></b><button type="button" class="next" aria-label="다음 달">›</button></div>
      <div id="cal"></div>
      <form class="form" id="bookForm" autocomplete="on">
        <div class="two"><label>체크인<input type="date" id="b-in" required></label><label>체크아웃<input type="date" id="b-out" required></label></div>
        <div id="b-info" class="note"></div>
        <label>인원<select id="b-ppl"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>10</option><option>12</option></select></label>
        <label>이름<input id="b-name" required maxlength="40"></label>
        <label>연락처<input id="b-phone" type="tel" required placeholder="010-0000-0000"></label>
        <label>이메일 (선택)<input id="b-email" type="email"></label>
        <label>요청 사항 (선택)<textarea id="b-memo" maxlength="1000" placeholder="도착 예정 시간, 아이 동반, 한달살이 문의 등"></textarea></label>
        <div class="hp"><label>웹사이트<input id="b-web" tabindex="-1" autocomplete="off"></label></div>
        <label class="chk"><input type="checkbox" id="b-ok"> <span>예약 확인 연락을 위해 이름·연락처·이메일을 수집·이용하는 데 동의합니다. <a href="privacy.html" target="_blank">자세히</a></span></label>
        <button class="btn" id="b-send" type="submit" style="width:100%;margin-top:16px">예약 요청 보내기</button>
        <div class="msg" id="b-msg" role="status"></div>
        <div class="note">요청을 보내면 클리더가 확인한 뒤 문자로 입금·이용 안내를 드립니다. 아직 결제되지 않습니다.</div>
        <a id="r-link" class="btn line" style="display:none;width:100%;margin-top:10px" target="_blank" rel="noopener">다른 예약 채널에서 보기</a>
      </form>
    </aside>
  </div>
  <div style="height:80px"></div>
</main>
<div class="mbook"><div><b id="m-price">요금 문의</b><div class="note" style="margin:0" id="m-info">날짜를 골라 주세요</div></div><button class="btn" id="m-go" type="button">예약 요청</button></div>
<footer id="ft"></footer>
<script src="regions.js"></script>
<script src="app.js"></script>
</body>
</html>
